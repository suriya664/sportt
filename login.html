<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Unity Sports Club - Login</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Teko:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <div class="auth-container">
        <div class="auth-card animate-up">
            <a href="index.html" class="d-inline-block mb-4 text-decoration-none">
                <h2 class="text-primary-custom fw-bold"><i class="fas fa-shield-alt me-2"></i>UNITY SC</h2>
            </a>
            <h4 class="mb-4">Welcome Back</h4>
            <form action="dashboard.html">
                <div class="mb-3 text-start">
                    <label class="form-label text-muted small">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i
                                class="far fa-envelope text-muted"></i></span>
                        <input type="email" class="form-control border-start-0 ps-0 bg-light"
                            placeholder="name@example.com" required>
                    </div>
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label text-muted small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i
                                class="fas fa-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0 ps-0 bg-light" placeholder="••••••••"
                            required>
                    </div>
                </div>
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary">Sign In</button>
                </div>
                <div class="text-center">
                    <small class="text-muted">Don't have an account? <a href="register.html"
                            class="text-primary-custom fw-bold">Join Now</a></small>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts (Optional here, but good for validation if added later) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
